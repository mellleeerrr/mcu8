# vks-media-mcu — MCU-движок (compositor, FFmpeg workers).
# Фаза 3 (DEVELOPMENT_PLAN.md): MediaEngine-impl (MCU), compositor,
# audio mixer, VAD, layout bridge.
#
# Dep-light: ядро компилируется на std + vks-core + vks-layout;
# реальные кодеки/композиция — через FFmpeg workers.
[package]
name = "vks-media-mcu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "VKS MCU engine: compositor, decoder, encoder, audio mixer, VAD (FFmpeg workers)"

[dependencies]
# Один syscall для убийства группы процессов FFmpeg (без порождения `/usr/bin/kill`).
libc.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
uuid.workspace = true
tokio.workspace = true
vks-core = { path = "../vks-core" }
vks-layout = { path = "../vks-layout" }
# Tick histograms live in the shared metrics registry; no cycle (vks-common is
# standalone). Gated at runtime by VKS_MCU_TICK_METRICS: when the flag is off the
# engine never calls observe_mcu_tick, so the default cost is one cached bool load
# per phase; a second (internal) load happens only on enabled, successful ticks.
# The server already links vks-common; stand-alone users inherit its metrics/config
# stack, which is acceptable here and could be feature-gated later.
vks-common = { path = "../vks-common" }
# async-traits для MediaEngine-порта (vks-core использует async_trait).
async-trait = "0.1"

[dev-dependencies]
prometheus.workspace = true
serde_json.workspace = true
