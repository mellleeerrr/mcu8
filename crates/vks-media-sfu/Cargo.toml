# vks-media-sfu — SFU-движок.
# Фаза 2 (DEVELOPMENT_PLAN.md): engine/forwarder/simulcast/bwe/congestion,
# DTLS-SRTP (str0m, optional feature), ICE-lite, codec feature flags (ADR-0017).
# Дерево: vks-core (MediaEngine-порт), vks-proto, vks-common (ARCHITECTURE.md §3).
[package]
name = "vks-media-sfu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "VKS SFU engine: forwarder, simulcast, BWE, congestion (str0m)"

[features]
# Codec registry features (ADR-0017): default = opus + vp8.
default = ["opus", "vp8"]
# DTLS-SRTP backend (optional; core compiles without it).
str0m = ["dep:str0m", "str0m/rust-crypto"]
# Codec feature flags (ADR-0017).
opus = []
vp8 = []
vp9 = []
av1 = []

[dependencies]
vks-core = { path = "../vks-core" }
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
async-trait = "0.1"
bytes.workspace = true
tokio = { workspace = true, features = ["net", "rt", "sync", "macros"] }
str0m = { version = "0.24", optional = true, default-features = false }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
