# vks-media-sfu — real WebRTC SFU (str0m) + room roster registry.
# The legacy plaintext MCU (forwarder/BWE/simulcast/UDP loop) was removed in
# T11c; media always flows through a per-peer DTLS/SRTP session.
# Дерево: vks-core (MediaEngine-порт), vks-common.
[package]
name = "vks-media-sfu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "VKS SFU: str0m WebRTC transport and room roster registry"

[features]
# str0m is the only media plane; it is on by default so `cargo test -p
# vks-media-sfu` can never silently run zero transport tests.
default = ["str0m"]
str0m = ["dep:str0m", "str0m/rust-crypto"]

[dependencies]
vks-core = { path = "../vks-core" }
vks-common = { path = "../vks-common" }
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
async-trait = "0.1"
bytes.workspace = true
tokio = { workspace = true, features = ["net", "rt", "sync", "macros", "time"] }
str0m = { version = "0.24", optional = true, default-features = false }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
