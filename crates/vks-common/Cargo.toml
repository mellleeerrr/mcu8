# vks-common — общие утилиты (error, tracing, metrics, config, ids).
# Крейт-привязка: docs/rules/BACKEND_RULES.md §6, docs/PROJECT_RULES.md §19–22.
[package]
name = "vks-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "VKS common utilities: error, tracing, metrics, config, ids"

[dependencies]
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
figment.workspace = true
uncased.workspace = true
prometheus.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
ulid.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

# T15/L0: SO_RCVBUF/SO_SNDBUF через безопасный API socket2 (crate уже в Cargo.lock).
[target.'cfg(unix)'.dependencies]
socket2.workspace = true

[dev-dependencies]
# proptest для property-тестов id-генерации
proptest.workspace = true
