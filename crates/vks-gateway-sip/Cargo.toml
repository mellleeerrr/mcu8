# vks-gateway-sip — SIP-шлюз (ADR-0006).
# Фаза 6 (DEVELOPMENT_PLAN.md): SIP UAS, «приземление» вызова в WebRTC-комнату
# (participant = gateway), codec negotiation SIP SDP → WebRTC SDP.
#
# Дерево зависимостей: vks-common (ARCHITECTURE §3); vks-core напрямую не нужен.
#
# SIP-транспорт: текущая волна — dep-light и полностью тестовая
# (mock UAS в `call.rs`); реальный SIP-стек (ADR-0006) ещё не подключён.
[package]
name = "vks-gateway-sip"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "VKS SIP gateway: SIP UAS bridged into WebRTC rooms"

[dependencies]
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
tokio.workspace = true
uuid.workspace = true
vks-common = { path = "../vks-common" }
oxideav-g722 = "=0.0.7"
oxideav-adpcm = "=0.0.7"
rusty-opus = "=1.0.2"
oxideav-g728 = "=0.0.8"
oxideav-g7231 = "=0.0.9"

[features]
default = []

[dev-dependencies]
tokio = { workspace = true }
