# vks-gateway-sip — SIP-шлюз (rvoip, ADR-0006).
# Фаза 6 (DEVELOPMENT_PLAN.md): SIP UAS, «приземление» вызова в WebRTC-комнату
# (participant = gateway), codec negotiation SIP SDP → WebRTC SDP.
#
# Дерево зависимостей: vks-core, vks-common (ARCHITECTURE §3).
#
# rvoip — тяжёлая FFI-зависимость (SIP UAS). В этой волне подключается за
# опциональным feature `rvoip`; дефолтная сборка остаётся dep-light и
# полностью тестовая (mock UAS в `call.rs`).
[package]
name = "vks-gateway-sip"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "VKS SIP gateway: SIP UAS (rvoip) bridged into WebRTC rooms"

[dependencies]
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
tokio.workspace = true
uuid.workspace = true
vks-core = { path = "../vks-core" }
vks-common = { path = "../vks-common" }

# Тяжёлая SIP-стек (опционально, ADR-0006).
rvoip = { version = "0.2", optional = true }

[features]
default = []
# Подключает rvoip SIP UAS (реальный SIP-транспорт).
rvoip = ["dep:rvoip"]

[dev-dependencies]
tokio = { workspace = true }
