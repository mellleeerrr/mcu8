# vks-proto — проводной протокол (protobuf + prost).
# Крейт-привязка: docs/architecture/SIGNALING_PROTOCOL.md.
# Дерево: standalone (не зависит от внутренних крейтов).
[package]
name = "vks-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "VKS wire protocol (protobuf/prost): signaling, media, cluster, admin"

[dependencies]
prost.workspace = true

[build-dependencies]
prost-build.workspace = true
# protoc из крейта: герметично (без сети), работает в пути с пробелом (ADR-0031).
# Системный protoc переопределяется переменной PROTOC.
protoc-bin-vendored = "3.3"
