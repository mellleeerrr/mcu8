# CI для workspace VKS.
# Основание: docs/DEVELOPMENT_PLAN.md (Фаза 0):
#   cargo fmt --check / clippy / test / deny / build --release.
name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Фиксируем версию под rust-toolchain.toml (MSRV 1.94.0, ADR-0024).
  RUST_TOOLCHAIN: 1.94.0

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo test --workspace

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # @v2 пиннит cargo-deny 0.20.2 (Dockerfile ветки v2) — та же версия проверена
      # локально (`--all-features check` → exit=0; CDLA-Permissive-2.0 в allow).
      # v1 (0.14.21) на текущей схеме deny.toml падает — блокер ревью B1.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  build:
    name: build (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo build --release

  # E2E (chromiumoxide) добавляется в фазе 8 (ADR-0020).
  # e2e:
  #   needs: [build]
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - run: cargo run -p vks-e2e
