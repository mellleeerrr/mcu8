# CI для workspace VKS.
# Основание: docs/DEVELOPMENT_PLAN.md (Фаза 0):
#   cargo fmt --check / check / clippy / test / deny / doc / build --release.
#
# Сборка: protoc герметичный (крейт `protoc-bin-vendored`, ADR-0031) —
# системный protoc не требуется ни в одном джобе.
#
# Образ пиним (`ubuntu-24.04`): `ubuntu-latest` — движущаяся цель, в ноябре
# 2026 переезжает на 26.04, а 22.04 уходит в депрекейшн (с 2026-09-17).
name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Фиксируем версию под rust-toolchain.toml (MSRV 1.94.0, ADR-0024).
  RUST_TOOLCHAIN: 1.94.0
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  check:
    name: check (all features)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-check-${{ hashFiles('**/Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}
      # --locked: CI не имеет права молча обновить Cargo.lock.
      # --all-features: компилирует str0m и все codec-фичи — раньше они
      # не компилировались ни в одном шаге CI.
      - run: cargo check --workspace --all-features --all-targets --locked

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-clippy-${{ hashFiles('**/Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}
      - run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings

  wasm-sdk:
    name: check (client SDK, wasm32)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-wasm-${{ hashFiles('**/Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}
      - name: cargo check (wasm32)
        run: cargo check -p vks-client-sdk --target wasm32-unknown-unknown --locked

  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-test-${{ hashFiles('**/Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}
      # --no-fail-fast: падение одного тестового бинарника не прячет остальные.
      # Фичи: default — полный набор тестов зелёный. Все фичи компилируются
      # жёстко в джобах check/clippy (--all-features --all-targets).
      - run: cargo test --workspace --locked --no-fail-fast

  # All-features прогон: ловит cfg-рассинхрон тестов (codec-фичи) и
  # feature-gated код, который компилируется, но не тестировался.
  test-all-features:
    name: test (all features)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-test-all-${{ hashFiles('**/Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}
      - run: cargo test --workspace --all-features --locked --no-fail-fast

  test-postgres:
    name: test (PostgreSQL)
    runs-on: ubuntu-24.04
    # T9: PG-путь проверяется на живом сервере, а не только sqlite/memory.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-postgres-${{ hashFiles('**/Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}
      - name: PG roundtrip (migrations + User/Room + TEXT UUID-биндинг)
        run: cargo test -p vks-storage --locked --no-fail-fast
        env:
          VKS_STORAGE_PG_URL: postgres://postgres:postgres@localhost:5432/vks

  test-serial:
    name: test (--test-threads=1)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-test-serial-${{ hashFiles('**/Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}
      # Однопоточный прогон: ловит гонки через порядок выполнения.
      # ThreadSanitizer требует nightly — поэтому так, а не TSAN.
      - run: cargo test --workspace --locked --no-fail-fast -- --test-threads=1

  path-with-spaces:
    name: build (path with spaces)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Checkout в каталог с пробелом — ровно то, что ломало
          # protobuf-src/autotools/libtool (ADR-0031).
          path: vks build with spaces
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vks build with spaces/target
          key: cargo-spaces-${{ hashFiles('**/Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}
      - name: Сборка в пути с пробелом
        working-directory: vks build with spaces
        run: cargo build --workspace --locked
      - name: Тесты протокола в пути с пробелом
        working-directory: vks build with spaces
        run: cargo test -p vks-proto --locked

  doc:
    name: rustdoc
    runs-on: ubuntu-24.04
    # Блокирующий гейт: все intra-doc-ссылки починены (T03b), `-D warnings`
    # ловит новые битые ссылки/HTML в PR.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      # PROJECT_RULES §2.3: rustdoc обязателен для vks-core/vks-proto/vks-auth/
      # vks-storage — ловим битые intra-doc-ссылки.
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings"

  sidecar:
    name: h323 sidecar (python)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned Pycrate runtime
        run: python -m pip install --require-hashes -r crates/vks-gateway-h323/python/requirements.lock
      - name: Unit tests (ASN.1 / Q.931 / H.245 contracts)
        working-directory: crates/vks-gateway-h323/python
        run: python -m unittest -v test_h323_sidecar test_h323_listener

  frontend-integrity:
    name: PNM frontend integrity (manifest + vendor patches)
    runs-on: ubuntu-24.04
    # S9: целостность вендорского бандла и патчи — часть контракта UI.
    # Раньше проверялись только вручную; дрейф MANIFEST или патча ловится здесь.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Manifest SHA256 of deployed PNM bundles
        working-directory: client/pnm-frontend/deployed/pnm
        run: sha256sum -c ../../MANIFEST.sha256
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Синтаксис JS-слоёв проекта (вендорские бандлы и патчи): раньше не
      # проверялся вообще, а синтаксическая ошибка в codian-layouts.js ломает UI.
      - name: node --check (project JS layers)
        run: |
          for f in client/pnm-frontend/deployed/pnm/*.js; do node --check "$f"; done
          for f in client/pnm-frontend/deployed/pnm/chunks/*.js; do node --check "$f"; done
      - name: Vendor patches are applied and idempotent
        run: |
          python3 scripts/patch-pnm-layout-crash.py --check
          python3 scripts/patch-pnm-audio-in-layouts.py --check
          python3 scripts/patch-pnm-chartjs.py --check
      - name: Unit tests (PNM patch lib)
        working-directory: scripts
        run: python -m unittest -v test_pnm_patch_lib

  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # @v2 пиннит cargo-deny 0.20.2 (Dockerfile ветки v2) — та же версия проверена
      # локально (`--all-features check` → exit=0).
      # v1 (0.14.21) на текущей схеме deny.toml падает — блокер ревью B1.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          args: --all-features --locked

  build:
    name: build (release)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ hashFiles('**/Cargo.lock', '.cargo/config.toml', 'rust-toolchain.toml') }}
      - run: cargo build --workspace --release --locked

  # E2E (chromiumoxide/Playwright) — MANUAL-ONLY: сьюты требуют живого
  # HTTP/SIP/WebRTC стенда, поэтому в CI не запускаются (см. tests/e2e/README.md).
  # CI-safe гейты JS-слоя: node --check, MANIFEST, patch --check,
  # Rust in-process calculate (см. frontend-integrity).
