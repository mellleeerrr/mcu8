# ПРИМЕР production-конфигурации VKS Server.
#
# НЕ запускайте этот файл как есть: замените все значения-заглушки.
# Секреты передавайте через переменные окружения VKS_* (BACKEND_RULES §6.3) —
# файл с реальными секретами в git не коммитится.
#
# Запуск:
#   cp configs/prod.example.toml /etc/vks/server.toml
#   chmod 600 /etc/vks/server.toml
#   VKS_CONFIG_PATH=/etc/vks/server.toml ./target/release/vks-server

server_name = "vks-mcu-prod"
listen_addr = "0.0.0.0:8080"

# Публичный IPv4, который анонсируется в SDP (обязателен за NAT).
# ВАЖНО: принимается только IP-адрес (DNS-имя сервер отвергает).
# Public address browsers use for the ICE host candidate. The real transport is
# mandatory (VKS_WEBRTC_TRANSPORT=1; unset/0 is exit 78 — there is no legacy
# fallback), so a valid candidate is mandatory; open the UDP range
# VKS_WEBRTC_PORT_MIN..MAX (or accept ephemeral ports). ICE-lite cannot gather
# TURN relay candidates itself.
# Пустое значение обязательно к заполнению: префлайт отвергает пусто и
# документационные TEST-NET адреса (RFC 5737) — лучше громкий exit 78, чем
# браузер, который молча не подключается.
# REAL WebRTC is the only media plane: fill this with the public/LAN address or
# startup fails closed (exit 78). VKS_WEBRTC_TRANSPORT=1 must be set explicitly
# in the environment; the legacy fake-SDP plane was removed.
candidate_addr = ""

# Аутентификация: JWT-секрет только из env, минимум 32 случайных байта:
#   VKS_JWT_SECRET="$(openssl rand -base64 48)"
auth_provider = "local"
jwt_ttl_secs = 28800

# Fail-closed: без сильного VKS_JWT_SECRET сервер не стартует; слабая/пустая
# БД без VKS_ADMIN_PASSWORD тоже даёт exit 78. Для dev — configs/default.toml.
allow_insecure_defaults = false

# Пароль оператора нужен только для первого bootstrap или разовой ротации
# слабой БД; после этого его можно убрать из env. В файле пароль не храните.
admin_login = "admin"

# Статика PNM UI (собирается scripts/import-pnm-frontend.sh).
# В production-раскладке: /opt/vks/frontend/pnm (см. deploy/README.md).
frontend_dir = "/opt/vks/frontend/pnm"

# Хранилище: PostgreSQL рекомендуется для production. Файл 0600/LoadCredential;
# VKS_DATABASE_URL (если задан в env) перекрывает это значение.
database_url = "postgres://vks:CHANGE_ME@db.internal:5432/vks"
storage_allow_fallback = false

# Внешние шлюзы (пусто = выключено).
ldap_url = ""

# Топология по умолчанию: "sfu" | "mcu".
default_room_mode = "sfu"

# ICE: для production используйте собственный TURN/STUN.
ice_servers = [
    "stun:stun.example.com:3478",
    "turn:turn.example.com:3478?transport=udp",
]

# --- Cluster bus / tracing (T14, P2; env-only, NOT wired in this build) -----
# Эти параметры НЕ читаются из TOML (Config их не знает) — только env:
#   VKS_NATS_URL=nats://127.0.0.1:4222   (пусто -> LocalTransport)
#   VKS_NATS_CONNECT_TIMEOUT_MS=5000
#   VKS_OTLP_ENDPOINT=http://127.0.0.1:4318  (пока игнорируется)
# NATS-адаптер и OTLP не собраны (blocked, см. docs/operations/cluster-bus.md);
# установленный VKS_NATS_URL даёт fail-open LocalTransport, сервер не падает.

# --- Native WebTransport (T13, P2; env-only, OFF by default) ----------------
# Build with `--features vks-server/webtransport`, then provision an operator
# certificate/key (TLS 1.3; ECDSA P-256 if native clients pin the hash) and set:
#   VKS_WEBTRANSPORT=1
#   VKS_WT_BIND=0.0.0.0:8443
#   VKS_WT_CERT=/etc/vks/wt-cert.pem
#   VKS_WT_KEY=/etc/vks/wt-key.pem
# Fail-closed: malformed values or unreadable PEM files exit 78. With the flag
# unset, /wt is 404, no Alt-Svc header is advertised and WS-only HTTP remains
# the production default. Open UDP 8443 only to native-client networks; the
# browser is not a supported WT client in this release.
# Optional limits: VKS_WT_MAX_CONNECTIONS=64, VKS_WT_MAX_FRAME_BYTES=65536,
# VKS_WT_HANDSHAKE_TIMEOUT_SECS=10, VKS_WT_IDLE_TIMEOUT_SECS=30,
# VKS_WT_KEEPALIVE_SECS=15.
