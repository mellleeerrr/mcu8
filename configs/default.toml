# DEV-конфигурация VKS Server (PROSTOR MCU/SFU). Только для локальной разработки:
# dev-секреты и `admin_password` ниже НЕЛЬЗЯ использовать в production.
# Явный opt-in: production-конфиг требует `allow_insecure_defaults = false`.
allow_insecure_defaults = true
# Production-шаблон: configs/prod.example.toml.
#
# All parameters can be overridden via environment variables with prefix VKS_*
# Example: VKS_LISTEN_ADDR="0.0.0.0:8080" VKS_JWT_SECRET="secret"

# Server identity
server_name = "vks-mcu"
listen_addr = "0.0.0.0:8080"
# WebRTC/шлюзовый Candidate IP announced in SDP.
# Реальный транспорт ОБЯЗАТЕЛЕН (VKS_WEBRTC_TRANSPORT=1; выключателя нет):
# preflight отвергает пустое значение,
# TEST-NET (RFC 5737) и невалидный IP (exit 78). Loopback допустим только в
# dev-конфиге (`allow_insecure_defaults = true`) или при
# VKS_ALLOW_LOOPBACK_MEDIA=1. Для стенда задайте реальный LAN IP
# (deploy/vks.env.example → VKS_CANDIDATE_ADDR).
candidate_addr = "127.0.0.1"

# Authentication & Identity (ADR-0009 / ADR-0022)
# Supported auth_provider strategies: "local" | "ldap" | "oidc"
auth_provider = "local"
jwt_secret = "dev_ec994ad4e03aa63eafc3131719a0a50cce4dbfb474c855b0"
jwt_ttl_secs = 86400

# Default bootstrap credentials for Operator in LocalDb
admin_login = "admin"
admin_password = "admin_password"

# Directory containing static files for PNM UI (ADR-0027)
frontend_dir = "client/pnm-frontend/deployed/pnm"

# Storage & Persistence (PostgreSQL, SQLite or Memory)
database_url = "sqlite://vks_data.db?mode=rwc"
storage_allow_fallback = false

# External Integrations
ldap_url = ""

# Default conferencing topology ("sfu" | "mcu")
default_room_mode = "sfu"

# ICE Servers (STUN / TURN)
ice_servers = [
    "stun:stun.l.google.com:19302"
]

# --- Cluster bus / tracing (T14, P2; env-only, NOT wired in this build) -----
# Эти параметры НЕ читаются из TOML (Config их не знает) — только env:
#   VKS_NATS_URL=nats://127.0.0.1:4222   (пусто -> LocalTransport)
#   VKS_NATS_CONNECT_TIMEOUT_MS=5000
#   VKS_OTLP_ENDPOINT=http://127.0.0.1:4318  (пока игнорируется)
# NATS-адаптер и OTLP не собраны (blocked, см. docs/operations/cluster-bus.md);
# установленный VKS_NATS_URL даёт fail-open LocalTransport, сервер не падает.

# --- Native WebTransport (T13, P2; env-only, OFF by default) ----------------
# Listener is UDP/QUIC (HTTP/3), TLS 1.3; native clients only in this release
# (browsers also need serverCertificateHashes + a trusted short-lived ECDSA
# cert — not claimed here). Requires a build with the `webtransport` feature:
#   cargo build -p vks-server --features vks-server/webtransport
# Then, and only then:
#   VKS_WEBTRANSPORT=1
#   VKS_WT_BIND=0.0.0.0:8443          # UDP bind; VKS_WT_PORT overrides the port
#   VKS_WT_CERT=/etc/vks/wt-cert.pem  # required; no self-signed fallback
#   VKS_WT_KEY=/etc/vks/wt-key.pem    # required
# When enabled, /wt and /wt/cert-hash appear and HTTP responses carry
# `Alt-Svc: h3=":<port>"; ma=86400`. When disabled (or unset), /wt is 404,
# no Alt-Svc is sent, and /ws is unchanged. Bad/missing PEM paths exit 78.
# Limits: VKS_WT_MAX_CONNECTIONS=64, VKS_WT_MAX_FRAME_BYTES=65536.
