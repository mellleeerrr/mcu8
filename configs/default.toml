# DEV-конфигурация VKS Server (PROSTOR MCU/SFU). Только для локальной разработки:
# dev-секреты и `admin_password` ниже НЕЛЬЗЯ использовать в production.
# Явный opt-in: production-конфиг требует `allow_insecure_defaults = false`.
allow_insecure_defaults = true
# Production-шаблон: configs/prod.example.toml.
#
# All parameters can be overridden via environment variables with prefix VKS_*
# Example: VKS_LISTEN_ADDR="0.0.0.0:8080" VKS_JWT_SECRET="secret"

# Server identity
server_name = "vks-mcu"
listen_addr = "0.0.0.0:8080"
media_listen_addr = "0.0.0.0:40000"
# WebRTC/шлюзовый Candidate IP announced in SDP.
# Пусто = fail-closed: preflight отвергает пусто и TEST-NET (RFC 5737), чтобы
# «валидный, но недостижимый» IP не ломал медиа молча. На стенде задаётся
# переменной VKS_CANDIDATE_ADDR=192.168.1.93 (см. deploy/vks.env.example).
candidate_addr = ""

# Authentication & Identity (ADR-0009 / ADR-0022)
# Supported auth_provider strategies: "local" | "ldap" | "oidc"
auth_provider = "local"
jwt_secret = "dev_ec994ad4e03aa63eafc3131719a0a50cce4dbfb474c855b0"
jwt_ttl_secs = 86400

# Default bootstrap credentials for Operator in LocalDb
admin_login = "admin"
admin_password = "admin_password"

# Directory containing static files for PNM UI (ADR-0027)
frontend_dir = "client/pnm-frontend/deployed/pnm"

# Storage & Persistence (PostgreSQL, SQLite or Memory)
database_url = "sqlite://vks_data.db?mode=rwc"
storage_allow_fallback = false

# External Integrations
ldap_url = ""

# Default conferencing topology ("sfu" | "mcu")
default_room_mode = "sfu"

# ICE Servers (STUN / TURN)
ice_servers = [
    "stun:stun.l.google.com:19302"
]
