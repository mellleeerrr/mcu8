/* Калибровка (T1.1): прячем кнопку раздела Calibration на экране Administration
   и первую плитку статистики в шапке (HeaderLarge/HeaderCompact) — оба ведут
   на /administration/calibration; deep-link уводит серверный 308. */
[data-qa="administration-calibration-button"],
.server-stats .server-stats__item:first-child {
  display: none !important;
}
/* T14: аватар участника в плитке раскладки УБРАН (заказчик: «вычистить
   именно этого аватара, чтобы он не отображался в раскладке»).
   Селектор — вендорский класс на корне TcAvatar. НЕ id: id вида
   «tc-avatar-<uuid>» генерируется заново на каждый маунт (getUUID), так
   что правило по id — одноразовый no-op.
   Правило строго scoped: глобальное .tc-avatar погасило бы аватары
   в «Получателях», в панели видеослота, в карточке комнаты и в шапке.
   Специфичность 0,2,0 — выше вендорской: CSS чанка 7 (layout-grid)
   подключается Vite рантаймом ПОСЛЕ этого блока, поэтому правило равной
   специфичности проигрывало бы по порядку в документе. display вендор для
   этого класса не задаёт (только height/width: 2em), поэтому !important
   не нужен.
   Побочный эффект, который это чинит: вендор рисует иконку человека
   фиксированными 24px (.tc-avatar-container .tc-avatar__name-icon),
   а бокс аватара = 2em = 16px в 9+/25/34+ — глиф вылезал за плашку на 4px
   в каждую сторону. */
.layout-grid-slot .layout-grid-slot__avatar {
  display: none;
}
/* T14: центровка подписи пересчитана под новый стек контента.
   Формула сдвига: header/2 + (avatar + gap)/2, где header = 2em (в потоке),
   avatar = 2em, gap = .67em.
   С аватаром: 1em + (2em + .67em)/2 = 2.335em (значение T12b).
   Без аватара display:none убирает элемент из flex-потока, и gap между
   единственным оставшимся элементом НЕ применяется ⇒ сдвиг = header/2 = 1em.
   Проверено Playwright: |dy| <= 0.01px на всех 10 размерах (1, 2, 3, 4, 5+,
   8, 9, 10+, 25, 34+), подпись целиком в плитке, переполнения нет.
   Правило ПАРНОЕ с предыдущим: сдвиг -2.335em без аватара уводил подпись
   вверх на 1.335em (dy = -16.03px при шрифте 12px, -10.69px при 8px). */
.layout-grid-slot-content:has(.layout-grid-slot-dn) {
  transform: translateY(-1em);
}
/* T14: плитка с ПРЕВЬЮ кадра. Вендор рисует MediaPreview (24x24 px, а НЕ em)
   вместо аватара, если у контакта есть preview ⇒ блок выше, нужен свой сдвиг:
   header/2 + (24px + gap)/2 = 1em + 12px + 0.335em.
   Это же правило чинит латентный баг: старая константа -2.335em промахивалась
   в превью-плитке на +4.00px (шрифт 8px) и +1.99px (шрифт 10px).
   Условие точное (по классу самого превью), а не «нет аватара»: плитка без
   аватара и без превью не ловит лишний сдвиг. Специфичность 0,3,0 > 0,2,0. */
.layout-grid-slot-content:has(.layout-grid-slot-dn):has(> .media-preview) {
  transform: translateY(calc(-1em - 12px - 0.335em));
}
/* T12b: previews сейчас без источника кадров — кнопку не показываем,
   чтобы не обещать мёртвый функционал. */
.session-abonents-table-config__checkbox--nested {
  display: none !important;
}
/* T13: подпись участника в плитке раскладки — вдвое крупнее.
   Вендор задаёт её как 1em от font-size плитки, а этот размер вендорный
   JS считает по площади слота (8/10/12px): 12px для 1..8 видеоокон и 8px
   для 9+ (то есть в 34+ подпись была 8px и не читалась). 2em даёт 24px
   и 16px соответственно — читаемо во всех раскладках.
   Переполнения нет: высота блока контента становится 4.87em при запасе
   плитки >= 10.3em (худший случай — 34+, плитка 74..89px при font 8px), а
   по ширине вендор уже ограничил подпись (nowrap + text-overflow: ellipsis).
   Центровка не ломается: контент центрируется по flex, а подпись — нижний
   элемент блока, поэтому её центр не зависит от высоты шрифта. После T14
   (аватар убран) сдвиг пересчитан на -1em — см. правило выше; |dy| <= 0.01px
   на всех 10 размерах (проверено Playwright).
   Специфичность выше вендорской (0,2,0 против 0,1,0): CSS чанка 7
   (layout-grid) подключается Vite рантаймом ПОСЛЕ этого блока, поэтому
   правило равной специфичности проиграло бы по порядку в документе. */
.layout-grid-slot .layout-grid-slot-dn__text {
  font-size: 2em;
}
/* T15: блок аудиоканалов переехал в панель «Раскладки» (патч вендорского
   чанка index6/index-legacy6). Панель «Раскладки» теперь содержит два блока:
   список раскладок и блок аудиоканалов.

   Зачем эти правила. Вендор задаёт .main-card-body{flex:1 1 1px} ⇒ оба блока
   делят высоту панели 50/50: пустой блок аудиоканалов занимает пол-экрана
   впустую (картинка 240px), а список раскладок сжимается. Если оба блока
   остаются «по контенту», а контейнер панели скроллится, то суммарная высота
   контента (807px в пустом состоянии) больше карточки (783.7px) ⇒ flexbox
   сжимает заголовок карточки (74.2 → 56px) и блок аудиоканалов уезжает НИЖЕ
   нижней границы карточки (overflow:hidden) — кнопка «Добавить» в нём
   становится недостижимой без прокрутки.

   Правила:
   - блок аудиоканалов — по своей естественной высоте, но не выше 320px
     (flex:0 0 auto + max-height): не выпирает из карточки и не сжимает
     заголовок; при большом числе каналов — свой скролл;
   - список раскладок сохраняет flex:1 1 1px: растёт на всю оставшуюся
     высоту панели и сжимается, когда места мало (свой скролл);
   - обе иллюстрации пустых состояний — 120×120 (T16, см. ниже): в
     объединённой панели видно картинку и у раскладок, и у аудиоканалов;
   - тело таблицы аудиоканалов — минимум 140px: вендорский
     .tc-list{flex:1 1 80px} иначе показывает всего 2 строки из 12+.

   Специфичность правил 0,3,0 / 0,4,0 / 0,5,0 — выше вендорской 0,1,0.
   Это обязательно: CSS чанка 7 (.conference-audio-channels, .layouts) и
   рантайм-подключаемые стили подгружаются ПОСЛЕ инлайн-блока
   #prostor-pnm-overrides, поэтому правило равной специфичности проиграло бы
   по порядку в документе. Правило для :first-child (0,5,0) перебивает
   правило с :has() (0,4,0) независимо от порядка. */
.main-card-body__container > .main-card-body.conference-audio-channels,
.main-card-body__container > .main-card-body.session-audio-channels {
  flex: 0 0 auto;
  min-height: 0;
  max-height: 320px;
  overflow-y: auto;
  border-top: 1px solid #dfdfdf;
  /* T16: компенсация высоты — вертикальный padding блока аудиоканалов
     16px → 12px (вендор: .conference-audio-channels{padding:16px 0},
     специфичность 0,1,0). Экономия 8px нужна, чтобы ДВА пустых
     состояния с иллюстрациями 120×120 влезли в карточку: без неё
     сумма 283.2 + 269.2 = 552.4px > контейнера 549.8px (1024×768),
     список раскладок получает собственную прокрутку, и кнопка
     «Добавить» уезжает за нижний край. С padding 12px сумма
     283.2 + 262.2 = 545.4px — запас 4.4px. */
  padding-top: 12px;
  padding-bottom: 12px;
}
.main-card-body__container:has(> .main-card-body.conference-audio-channels) > .main-card-body:first-child,
.main-card-body__container:has(> .main-card-body.session-audio-channels) > .main-card-body:first-child {
  flex: 1 1 1px;
}
/* T16: иллюстрации пустых состояний — ровно вдвое меньше вендорских.
   Заказчик: «сделай меньше в 2 раза».
     • BSmrOOY7.svg — пустое состояние списка РАСКЛАДОК (LayoutBlank);
     • eNWXoy3B.svg — пустое состояние списка АУДИОКАНАЛОВ (AudioChannelBlank).
   Вендор: .main-blank__image{height:240px;width:240px} (0,1,0), обе SVG
   квадратные (viewBox 0 0 240 240) ⇒ 120×120 = ровно половина.

   Область действия — ТОЛЬКО объединённая панель «Раскладки» (конференция
   и сессия). Селекторы — по классу блока, без :has():

<style id="prostor-pnm-dark-theme">
/* ==========================================================================
   PROSTOR PNM - Telegram.org Design System Dark Theme
   Official Telegram Desktop/Web Dark Palette:
   - Primary: #0088CC (Telegram Steel Blue)
   - Accent / Links: #2AABEE (Telegram Light Blue)
   - Canvas / Background: #0E1621 (Deep Midnight Blue)
   - Surface / Cards / Header: #17212B (Telegram Surface)
   - Surface Card / Modals: #242F3D (Elevated Surface)
   - Hover / Surface Light: #202B36 (Noticeable Row Hover, dE ~ 8.5)
   - Text Primary: #FFFFFF (Contrast 18.18:1 on Canvas)
   - Text Secondary / Muted: #9BB1C9 (WCAG AA 5.2:1 on Surface, 4.7:1 on Modals)
   - Text Active / Selected: #FFFFFF (Contrast 8.14:1 on Selected)
   - Borders: #243342 (Inputs, Selects, Cards)
   - Dividers: #0F1C26 (Subtle Row Lines)
   - Active / Selected: #2B5278 (Telegram Message Bubble / Selected Row)
   ========================================================================== */

:root {
  --tg-primary: #0088cc;
  --tg-accent: #2aabee;
  --tg-bg: #0e1621;
  --tg-surface: #17212b;
  --tg-surface-card: #242f3d;
  --tg-surface-hover: #202b36;
  --tg-text: #ffffff;
  --tg-text-muted: #9bb1c9;
  --tg-text-selected: #ffffff;
  --tg-border: #243342;
  --tg-border-light: #323e4d;
  --tg-divider: #0f1c26;
  --tg-active: #2b5278;
}

/* 1. Global Shell & Screens */
html.theme-dark,
html.theme-dark body,
html.theme-dark #root,
html.theme-dark .main,
html.theme-dark .main-route,
html.theme-dark .auth,
html.theme-dark .auth__content,
html.theme-dark .main-blank,
html.theme-dark .monitoring-screen,
html.theme-dark .user-screen,

}

html.theme-dark .main__background { display: none !important; }

/* Brand Logo Contrast Fix (18.18:1 vs 1.24:1) */

  color: var(--tg-text) !important;

/* Auth Form Header Layout */

html.theme-dark .main-compact-header,

}

/* 4. Inputs, Selects & Form Controls */
html.theme-dark input,

html.theme-dark .mdc-select__anchor,
html.theme-dark .mdc-text-field--filled,

}
html.theme-dark .mdc-elevation-overlay,
html.theme-dark .mdc-switch__shadow .mdc-elevation-overlay {

  background-color: var(--tg-surface) !important;

html.theme-dark .material-icons,
html.theme-dark .tc-icon__icon,

}
</style>
