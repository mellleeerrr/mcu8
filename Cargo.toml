# VKS — видеоконференцсвязь на Rust
# Корневой Cargo workspace.
#
# Состав крейтов зафиксирован в docs/architecture/ARCHITECTURE.md §3
# и в дереве зависимостей (docs/PROJECT_RULES.md §7.2 → ARCHITECTURE.md §3).
# Добавление нового крейта — только через ADR (docs/decisions/DECISIONS.md).
#
# Все 16 крейтов наполнены; границы и зависимости зафиксированы в
# docs/architecture/ARCHITECTURE.md §3. Новый крейт — только через ADR.

[workspace]
resolver = "2"
members = [
    "crates/vks-core",
    "crates/vks-proto",
    "crates/vks-common",
    "crates/vks-auth",
    "crates/vks-storage",
    "crates/vks-layout",
    "crates/vks-signaling",
    "crates/vks-media-sfu",
    "crates/vks-media-mcu",
    "crates/vks-gateway-h323",
    "crates/vks-gateway-sip",
    "crates/vks-admin",
    "crates/vks-recorder",
    "crates/vks-cluster",
    "crates/vks-server",
    "client/vks-client-sdk",
]

# Общие зависимости (workspace inheritance) — фиксируем версии в одном месте.
# Крейты подключают их через `dep = { workspace = true }`.
[workspace.dependencies]
# runtime / async
tokio = { version = "1", features = ["full"] }
bytes = "1"
http-body = "1"
subtle = "2.6"
libc = "0.2"
# ошибки
thiserror = "2"
anyhow = "1"
# логирование и метрики
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus = "0.14"
# конфиг
figment = { version = "0.10", features = ["toml", "env", "json"] }
uncased = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# пароли
argon2 = "0.5.3"
# идентификаторы
uuid = { version = "1", features = ["v4", "v7", "serde", "js"] }
ulid = { version = "1", features = ["std", "serde"] }
# protobuf
prost = "0.13"
prost-build = "0.13"
# веб / api
axum = { version = "0.8", features = ["ws", "multipart"] }
# Статика фронтенда PNM: ServeDir/ServeFile (ADR-0027, docs/progress/archive/FRONTEND_PORT_PLAN.md §4.2).
# Мержит `fs`-фичу (без default, чтобы не тянуть trace/cors в бинарник).
tower-http = { version = "0.6", default-features = false, features = ["fs", "compression-gzip"] }
# CSP-хэши inline-скриптов index.html (frontend.rs).
sha2 = "0.10"
base64 = "0.22"
# тесты
proptest = "1"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
authors = ["VKS Team"]

# Профили — единственное место (раньше дублировались в .cargo/config.toml,
# где значения молча перекрывались; см. T3.2).
[profile.dev]
# Быстрые итерации: debuginfo на уровне line-tables, 1 кодовый блок.
debug = "line-tables-only"

[profile.release]
# Финальная сборка для production (см. docs/rules/CODE_STYLE.md).
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
# `unwind`, а не `abort`: паника в задаче рендера (30 fps) или в обработчике
# запроса не должна ронять весь сервер. `catch_unwind` в `vks-gateway-h323`
# (FFI-мост) и в `vks-media-mcu` без unwinding просто не работали бы.
# Цена — таблица раскрутки в бинарнике (~1 % к размеру).
panic = "unwind"

# Прочий (benches) — без оптимизаций, быстро.
[profile.bench]
opt-level = 3
