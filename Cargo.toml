# VKS — видеоконференцсвязь на Rust
# Корневой Cargo workspace.
#
# Состав крейтов зафиксирован в docs/architecture/ARCHITECTURE.md §3
# и в дереве зависимостей (docs/PROJECT_RULES.md §7.2 → ARCHITECTURE.md §3).
# Добавление нового крейта — только через ADR (docs/decisions/DECISIONS.md).
#
# В фазе 0 наполняются только vks-common и vks-proto; остальные крейты
# перечислены как workspace members, чтобы дерево соответствовало архитектуре,
# и будут наполняться в фазах 1–8 по DEVELOPMENT_PLAN.md.

[workspace]
resolver = "2"
members = [
    "crates/vks-core",
    "crates/vks-proto",
    "crates/vks-common",
    "crates/vks-auth",
    "crates/vks-storage",
    "crates/vks-layout",
    "crates/vks-signaling",
    "crates/vks-media-sfu",
    "crates/vks-media-mcu",
    "crates/vks-gateway-h323",
    "crates/vks-gateway-sip",
    "crates/vks-admin",
    "crates/vks-recorder",
    "crates/vks-cluster",
    "crates/vks-server",
    "client/vks-client-sdk",
]

# Общие зависимости (workspace inheritance) — фиксируем версии в одном месте.
# Крейты подключают их через `dep = { workspace = true }`.
[workspace.dependencies]
# runtime / async
tokio = { version = "1", features = ["full"] }
bytes = "1"
parking_lot = "0.12"
subtle = "2.6"
# ошибки
thiserror = "2"
anyhow = "1"
# логирование и метрики
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus = "0.14"
# конфиг
figment = { version = "0.10", features = ["toml", "env", "json"] }
uncased = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# идентификаторы
uuid = { version = "1", features = ["v4", "v7", "serde", "js"] }
ulid = { version = "1", features = ["std", "serde"] }
# protobuf
prost = "0.13"
prost-build = "0.13"
# веб / api
axum = { version = "0.8", features = ["ws", "multipart"] }
utoipa = { version = "5", features = ["axum_extras"] }
# Статика фронтенда PNM: ServeDir/ServeFile (ADR-0027, archive/FRONTEND_PORT_PLAN.md §4.2).
# Мержит `fs`-фичу (без default, чтобы не тянуть trace/cors в бинарник).
tower-http = { version = "0.6", default-features = false, features = ["fs"] }
# CSP-хэши inline-скриптов index.html (frontend.rs).
sha2 = "0.10"
base64 = "0.22"
# тесты
proptest = "1"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
authors = ["VKS Team"]

# Профили — единственное место (раньше дублировались в .cargo/config.toml,
# где значения молча перекрывались; см. T3.2).
[profile.dev]
# Быстрые итерации: debuginfo на уровне line-tables, 1 кодовый блок.
debug = "line-tables-only"

[profile.release]
# Финальная сборка для production (см. docs/rules/CODE_STYLE.md).
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

# Прочий (benches) — без оптимизаций, быстро.
[profile.bench]
opt-level = 3
