# VKS MCU — L0 network tuning (T15), managed by scripts/host-tune.sh.
#
# Apply:    sudo scripts/host-tune.sh apply
# Verify:   scripts/host-tune.sh check        (read-only, no root)
# Rollback: sudo scripts/host-tune.sh rollback
#
# Why: the media plane is UDP (SIP/H.323 RTP, WebRTC ICE/DTLS/SRTP). Default
# rmem_max (208 KiB on Ubuntu) silently caps every SO_RCVBUF request from
# `vks_common::net_tuning`, so a burst of RTP/ICE datagrams is dropped in the
# kernel before tokio/str0m ever sees it. These are *ceilings*: they only take
# effect on sockets that call setsockopt (the MCU does, see
# docs/operations/host-l0-tuning.md §3). Values are sized for 36 cores /
# <=256 WebRTC peers; do not "tune by folklore" on a different host class.
#
# Only root can write /proc/sys; host-tune.sh refuses to apply without root
# (unless --dry-run) instead of silently doing nothing.

# --- UDP socket buffers -----------------------------------------------------
# 16 MiB ceilings: media loop requests 4 MiB (kernel doubles to 8 MiB),
# per-call RTP sockets request 512 KiB. 16 MiB leaves headroom for operators
# who raise VKS_UDP_RCVBUF_BYTES without re-running sysctl.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
# Defaults for sockets that do NOT call setsockopt (e.g. the Python H.323
# sidecar): 1 MiB instead of 208 KiB. Explicit setsockopt still wins.
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576

# --- Softnet (RX backlog / NAPI) -------------------------------------------
# A 36-core host can raise 100k+ UDP pps during a burst; the default backlog
# of 1000 datagrams and 300-packet/2 ms NAPI budget drop packets under IRQ
# pressure. These are the documented upstream "40000 pps+" values.
net.core.netdev_max_backlog = 5000
net.core.netdev_budget = 600
net.core.netdev_budget_usecs = 8000

# --- Ephemeral ports / media port protection -------------------------------
# Widen the ephemeral range for outbound RTP/STUN/TURN and gateways.
net.ipv4.ip_local_port_range = 10240 65000
# Keep the explicitly bound media ports OUT of the ephemeral pool: without
# this, an outbound connection can grab :43000 right before ICE tries to bind
# it (bind fails, port_range_exhausted, peer rejected). Keep in sync with
# VKS_WEBRTC_PORT_MIN/MAX and the SIP RTP port pool (41000-41199).
net.ipv4.ip_local_reserved_ports = 40000,41000-41199,43000-43100
