# VKS MCU prod unit L0 drop-in (T15), managed by scripts/host-tune.sh.
#
# Install (root):  sudo scripts/host-tune.sh apply --systemd
# This is a *drop-in* for /etc/systemd/system/vks-mcu-prod.service, so an
# existing unit file is never overwritten. Load it with `systemctl daemon-reload`
# (host-tune.sh does that) — never restart the service just to apply limits;
# a restart is a T17 operation that drops live calls.
#
# systemd 259 / cgroup v2. If `systemd-analyze verify` complains about IOWeight
# on a host without the io controller, remove that one line: memory/CPU limits
# are the important part.
[Service]
# All vks services share one slice so memory/CPU/IO weights are enforced
# together (see deploy/host/systemd/vks.slice).
Slice=vks.slice

# Hard cap + reclaim threshold. The prod unit also carries these values, so a
# host that installs only the unit (without this drop-in) is still limited.
MemoryMax=3G
MemoryHigh=2G
CPUWeight=200
IOWeight=100

# One file descriptor per peer socket + RTP/RTCP pairs + WS/HTTP. 65536 is the
# already-shipped value; repeated here so the drop-in is self-contained.
LimitNOFILE=65536

# Media latency preference without real-time scheduling: a negative nice value
# is applied by systemd as root before DynamicUser drops privileges. RT
# (SCHED_FIFO/SCHED_RR) is intentionally NOT used: media runs on the shared
# tokio runtime, and an RT tokio worker can starve the HTTP/admin threads and
# lock up the process. See docs/operations/host-l0-tuning.md §4.
Nice=-5
CPUSchedulingPolicy=other
