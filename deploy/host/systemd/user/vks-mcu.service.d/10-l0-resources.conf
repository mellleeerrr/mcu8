# VKS MCU *user* unit L0 drop-in (T15) for the local stand.
# Managed by scripts/host-tune.sh (T15/L0).
#
# Install (no root): scripts/host-tune.sh apply --user
# Target: ~/.config/systemd/user/vks-mcu.service.d/10-l0-resources.conf
# Then:   systemctl --user daemon-reload   (host-tune.sh does it)
# Do NOT restart the live stand from this script; apply at T17 or with an
# explicit operator restart.
#
# cgroup v2 note (systemd 259, Ubuntu): the user manager delegates
# cpu/memory/pids to user@UID.service on this host, but NOT io. Therefore
# IOWeight is intentionally absent (it would be silently ineffective); a
# negative Nice or RT policy is also unavailable/unsafe for user units:
#   - RLIMIT_NICE=0 for the user manager => Nice can only be >= 0;
#   - SCHED_FIFO/RR would need LimitRTPRIO and can starve the shared runtime.
# Use the system-level prod unit (deploy/host/systemd/vks-mcu-prod.service.d/)
# for real IO/RT privilege. See docs/operations/host-l0-tuning.md §4.
[Service]
# Stand peak is ~0.7 GiB with encoder groups; 1.5 GiB high-water leaves room
# for one busy room, 2 GiB is the hard ceiling (OOM instead of host swap).
MemoryHigh=1536M
MemoryMax=2G
CPUWeight=200
LimitNOFILE=65536
Nice=0
CPUSchedulingPolicy=other
